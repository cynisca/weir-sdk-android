<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Your Path</title>
<style>

:root {
  --bg: #f3efe6;
  --surface: #faf7f0;
  --text: #20281f;
  --text-muted: #6d6a5c;
  --text-dim: #6d6a5c;
  --primary: #1f6b4a;
  --on-primary: #ffffff;
  --accent: #c9a227;
  --on-accent: #20281f;
  --border: #e4ddcd;
  --success: #3fae6a;
  --danger: #d9534f;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --spacing: 18px;
  --font: Iowan Old Style, Palatino, Georgia, serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: Iowan Old Style, Palatino, Georgia, serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-label: Iowan Old Style, Palatino, Georgia, serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --anim-duration: 240ms;
  --anim-easing: cubic-bezier(.2,.8,.2,1);
  /* spec_2 §7 Motion — measured off native Niyat onboarding
     (docs/motion-tokens.md), the default screen/entrance/confirmation
     tokens every template gets unless a flow overrides theme.animation. */
  --motion-screen: 440ms cubic-bezier(0.42, 0, 0.58, 1);
  --motion-entrance: 800ms cubic-bezier(0.2, 0.7, 0.3, 1);
  --motion-spring-pop: 450ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  /* spec_2 §7 Touch — no highlight flash, no callout/selection menu on
     press, no rubber-band scroll on screens that don't scroll (there's no
     scrollable content in a fixed-viewport onboarding/paywall screen).
     Text inputs opt back into selection below. */
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
input, textarea {
  -webkit-touch-callout: default;
  -webkit-user-select: text;
  user-select: text;
}
button, .btn, .option, a {
  /* Correct touch-action: no double-tap-to-zoom delay on interactive
     controls, but don't disable pinch-zoom/scroll globally. */
  touch-action: manipulation;
}
.progress-track {
  height: 4px;
  background: var(--border);
  flex: 0 0 auto;
}
.progress-fill {
  height: 100%;
  width: 100%;
  background: var(--accent);
  /* transform, not width — see .loader-fill's comment (spec_2 §7 Motion). */
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--anim-duration) var(--anim-easing);
}
#app {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  /* spec_2 §7 Chrome — viewport-fit=cover (set on the <meta viewport> tag)
     means content draws under the notch/Dynamic Island/home-indicator
     unless padded back out with env(safe-area-inset-*); the additive
     calc() keeps normal spacing on non-notch devices where the env()
     value is 0. Bottom gets the most since that's where a primary CTA
     sits closest to the home indicator. */
  padding: calc(var(--spacing) * 2 + env(safe-area-inset-top)) calc(var(--spacing) + env(safe-area-inset-right)) calc(var(--spacing) * 2 + env(safe-area-inset-bottom)) calc(var(--spacing) + env(safe-area-inset-left));
  /* Establishes a stacking context above the fixed ambient particle layer
     (z-index -1) so screen content can never be covered by it. */
  position: relative;
  z-index: 1;
}
.screen { width: 100%; display: flex; justify-content: center; }
.card {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: calc(var(--spacing) * 0.75);
}
.eyebrow {
  margin: 0;
  font-family: var(--font-label);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}
.kicker {
  margin: 0 0 10px;
  font-family: var(--font-label);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
.moment-kicker { position: relative; z-index: 1; }
.title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text);
}
/* v0.2 — *emphasis* runs inside a heading() text render gold-italic-serif,
   the rest stays normal ink. See renderEmphasisInto() in the runtime. */
.heading-em {
  color: var(--accent);
  font-style: italic;
  font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
}
.subtitle {
  margin: 0;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-muted);
}
.btn {
  appearance: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  padding: 14px 20px;
  border-radius: var(--radius-md);
  transition: transform var(--anim-duration) var(--anim-easing), opacity var(--anim-duration) var(--anim-easing);
}
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  margin-top: calc(var(--spacing) * 0.5);
}
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary:disabled:active { transform: none; }
/* v2 — Cta.variant:"accent" gold treatment. Text uses var(--bg), matching
   the moment-card convention (see gradientFor()'s caller) for text laid
   over a colorful/mid-tone surface rather than a hardcoded white/black. */
.btn-accent {
  background: var(--accent);
  color: var(--on-accent);
  margin-top: calc(var(--spacing) * 0.5);
}
.btn-accent:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-accent:disabled:active { transform: none; }
.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.btn-link {
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  padding: 8px;
  text-decoration: underline;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
/* optionsLayout: "grid2"/"grid3" (default "stack" keeps the vertical list
   above unchanged) — side-by-side cards, icon above label, centered. */
.options-grid2, .options-grid3 { display: grid; gap: 10px; }
.options-grid2 { grid-template-columns: repeat(2, 1fr); }
.options-grid3 { grid-template-columns: repeat(3, 1fr); }
.option-grid {
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  padding: 20px 12px;
}
.option-grid .option-text { align-items: center; }
.option-grid .option-icon-tile { width: 44px; height: 44px; background: transparent; }
.option-grid .option-icon-tile svg { width: 28px; height: 28px; }
.option-grid .option-affordance { margin-left: 0; margin-top: 4px; }
.option {
  appearance: none;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  transition: border-color var(--anim-duration) var(--anim-easing), background var(--anim-duration) var(--anim-easing);
}
.option.selected {
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 14%, var(--surface));
}
/* label + description stack; a single child in the row reads identically to
   the old column layout, so options without an icon are unaffected. */
.option-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
/* selection affordance — radio (single) / checkbox (multi), pushed to the right */
.option-affordance {
  flex: none; width: 22px; height: 22px; margin-left: 8px;
  border: 1.5px solid var(--border); position: relative;
  transition: border-color var(--anim-duration) var(--anim-easing), background var(--anim-duration) var(--anim-easing);
}
.option-radio { border-radius: 50%; }
.option-check { border-radius: 6px; }
.option.selected .option-affordance { border-color: var(--primary); background: var(--primary); }
.option.selected .option-radio::after {
  content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--on-primary);
}
.option.selected .option-check::after {
  content: ""; position: absolute; left: 7px; top: 3px; width: 5px; height: 10px;
  border: solid var(--on-primary); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.option-label { font-size: 16px; font-weight: 600; color: var(--text); }
.option-desc { font-size: 13px; color: var(--text-muted); }
/* v0.2 — optional icon tile to the left of the label (Option.icon). Graceful:
   only rendered when the icon token is recognized (see ICON_SVG). */
.option-icon-tile {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--accent) 16%, var(--surface));
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.option-icon-tile svg { width: 18px; height: 18px; display: block; }
.slider-value {
  font-size: 32px;
  font-weight: 700;
  text-align: center;
  color: var(--accent);
}
.slider {
  width: 100%;
  accent-color: var(--primary);
  height: 6px;
}
.text-input {
  width: 100%;
  font-family: inherit;
  font-size: 16px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
}
.text-input:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
.input-unit { font-size: 13px; color: var(--text-muted); }
/* numberInput style:"stepper" / customHtml's [data-weir-stepper] — shared
   −/value/+ control. */
.stepper-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 16px;
}
.stepper-btn {
  appearance: none;
  cursor: pointer;
  touch-action: manipulation;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text);
  font-size: 20px;
  line-height: 1;
}
.stepper-btn:disabled { opacity: 0.35; cursor: default; }
.stepper-value-wrap { display: flex; align-items: baseline; gap: 4px; }
.stepper-value { font-size: 28px; font-weight: 700; color: var(--text); }
.stepper-unit { font-size: 13px; color: var(--text-muted); }
/* numberInput.unitToggle — a segmented unit pill above a single stepper
   (e.g. LB/KG), matching native's weight-entry control. */
.unit-toggle-stepper { display: flex; flex-direction: column; gap: 8px; }
.unit-toggle-row { display: flex; justify-content: flex-end; gap: 4px; }
.unit-toggle-btn {
  appearance: none;
  cursor: pointer;
  touch-action: manipulation;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-label);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 5px 12px;
  border-radius: 999px;
}
.unit-toggle-btn.selected { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
/* numberInput.display:"feetInches" — two side-by-side steppers (feet, inches)
   combining into one canonical centimeter value, matching native's
   height-entry control. */
.feet-inches-stepper { display: flex; gap: 10px; }
.feet-inches-stepper .stepper-control { flex: 1; }
.loader-card { align-items: center; text-align: center; }
.loader-track {
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: var(--border);
  overflow: hidden;
}
.loader-fill {
  height: 100%;
  width: 100%;
  background: var(--accent);
  /* transform, not width — width triggers layout on every animation frame
     (spec_2 §7 Motion: compositor-friendly properties only). scaleX from a
     fixed-width element is the standard progress-bar trick for the same
     visual result off the compositor thread. */
  transform: scaleX(0);
  transform-origin: left;
  transition: transform linear;
}
.loader-message { color: var(--text-muted); font-size: 15px; min-height: 1.5em; }
.rating-row { display: flex; align-items: baseline; gap: 8px; }
.rating-stars { color: var(--accent); font-size: 20px; letter-spacing: 2px; }
.rating-value { color: var(--text-muted); font-size: 14px; }

/* -- v2: FeatureList (paywall.features, permissionPrime/textInput.benefits,
   welcome.socialProof) -- */
.feature-list { display: flex; flex-direction: column; gap: 14px; }
.feature-row { display: flex; flex-direction: row; align-items: flex-start; gap: 12px; }
.feature-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.feature-title { font-size: 15px; font-weight: 700; color: var(--text); }
.feature-subtitle { font-size: 13px; line-height: 1.4; color: var(--text-muted); }
/* paywall.featureStyle: "cards" (default "plain" keeps the bare list above
   unchanged) — each row gets its own surface-tinted card row instead of
   sitting bare against the screen background, matching production paywalls
   that render benefits as individual dark rows. */
.feature-list-cards { gap: 10px; }
.feature-list-cards .feature-row {
  align-items: center;
  background: var(--surface);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
}
/* Rounded surface card wrapping feature rows — used for permissionPrime
   and textInput benefits, sat between the subtitle and the CTA(s). */
.benefit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: calc(var(--spacing) * 0.85);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
/* welcome.socialProof — centered star row + ratingCount, then an uppercase
   muted tagline. Reuses .rating-row/.rating-stars/.rating-value above. */
.social-proof { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.social-proof-tagline {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.testimonials { display: flex; flex-direction: column; gap: 12px; }
.testimonial {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.testimonial-quote { margin: 0; font-size: 15px; color: var(--text); line-height: 1.4; }
.testimonial-author { font-size: 13px; color: var(--text-muted); }
.products {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
/* paywall.productsLayout: "row" (default "stack" keeps the full-width
   vertical list above unchanged) — a 2-up side-by-side card grid. */
.products-row {
  flex-direction: row;
  align-items: stretch;
}
.products-row .product {
  flex: 1 1 0;
  flex-direction: column;
  align-items: center;
  text-align: center;
  justify-content: center;
  gap: 4px;
}
.product {
  cursor: pointer;
  position: relative;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: border-color var(--anim-duration) var(--anim-easing);
}
.product.selected { border-color: var(--primary); }
.product.highlighted { border-color: var(--accent); }
.product-caption { font-size: 12px; font-weight: 700; color: var(--success); }
.product-badge {
  position: absolute;
  top: -10px;
  left: 14px;
  background: var(--accent);
  color: var(--on-primary);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
}
.product-label { font-weight: 600; color: var(--text); }
.product-price { color: var(--text-muted); font-size: 14px; }
.paywall-error { margin: 0; font-size: 13px; text-align: center; color: var(--danger); }
.legal-links { display: flex; gap: 16px; justify-content: center; }
.legal-link { color: var(--text-dim); font-size: 12px; text-decoration: underline; }
.paywall-footnote { margin: 0; font-size: 12px; line-height: 1.5; text-align: center; color: var(--text-dim); }
/* spec_2 — paywall dismiss affordance: a subtle top-corner close control,
   the same pattern native paywalls (StoreKit/Superwall) use, so a paywall
   is never inescapable except by design. .paywall-card needs position:
   relative as the close button's positioning context; button/touch-action/
   tap-highlight already come from the global button rule above. */
.paywall-card { position: relative; }
.paywall-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 18px;
  line-height: 1;
  padding: 0;
}
.paywall-dismiss-link {
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  text-decoration: underline;
  align-self: center;
  padding: 4px;
}
/* paywall.contentAlign: "center" (default "left" preserves every existing
   paywall's current layout). .card is already a flex column, so centering
   just needs align-items — feature rows and the product grid opt back out
   of the inherited text-align:center since production centers only the
   headline/subtitle/footnote tier, not each row's own internal text. */
.paywall-centered { align-items: center; text-align: center; }
.paywall-centered .products { width: 100%; }
.paywall-centered .feature-row { width: 100%; text-align: left; }
.custom-html-card .custom-html { color: var(--text); }

/* -- v3: demo / welcome.demo (canned sourced-answer chat transcript) -- */
.chat-transcript { display: flex; flex-direction: column; gap: 12px; }
.chat-row { display: flex; flex-direction: row; gap: 8px; }
.chat-row-user { justify-content: flex-end; }
.chat-row-app { justify-content: flex-start; }
/* Small "ن" avatar tile, same gold-tint convention as .option-icon-tile. */
.chat-avatar {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 18%, var(--surface));
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, "Traditional Arabic", "Geeza Pro", serif;
  font-size: 15px;
  font-weight: 700;
}
.chat-col { display: flex; flex-direction: column; gap: 6px; max-width: 78%; }
.chat-row-user .chat-col { align-items: flex-end; }
.chat-name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
.chat-bubble { padding: 10px 14px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.45; }
.chat-bubble-user { background: var(--primary); color: var(--on-primary); border-bottom-right-radius: 4px; }
.chat-bubble-app { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
/* Gold citation chips under app messages — same tint formula as .option-icon-tile. */
.chat-sources { display: flex; flex-wrap: wrap; gap: 6px; }
.chat-source-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 16%, var(--surface));
  color: var(--accent);
}

/* -- v0.2: moment (full-bleed reveal) -- */
.moment-card {
  position: relative;
  min-height: 62vh;
  border-radius: var(--radius-lg);
  padding: calc(var(--spacing) * 1.5);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: calc(var(--spacing) * 0.75);
  /* Background is a brand-warm gradient (see gradientFor()); text stays the
     theme's cream background tone for contrast, never a hardcoded white. */
  color: var(--bg);
  overflow: hidden;
}
/* Photo-backed moment goes FULL-BLEED when #app drops its padding (via the
   bleed class toggled in render): the image reaches every screen edge, the
   content column sits bottom-left over the scrim — matching native's cinematic
   moments. No position:fixed (which breaks under the transition transform). */
#app.bleed { padding: 0; }
.moment-card.moment-photo {
  max-width: none;
  width: 100%;
  min-height: calc(100vh - 4px);
  border-radius: 0;
  padding: calc(var(--spacing) * 3) calc(var(--spacing) * 1.75) calc(var(--spacing) * 2.5);
}
.moment-content {
  display: flex;
  flex-direction: column;
  gap: calc(var(--spacing) * 0.75);
  width: 100%;
  max-width: 34rem;
  align-self: flex-start;
}
.moment-content .btn-primary, .moment-content .btn-accent { align-self: stretch; }
.moment-headline {
  margin: 0;
  font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  font-size: 30px;
  line-height: 1.3;
  font-weight: 600;
}
.moment-body { margin: 0; font-size: 15px; line-height: 1.5; opacity: 0.85; }
.moment-citation {
  border-left: 3px solid color-mix(in srgb, var(--bg) 55%, transparent);
  padding-left: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.citation-text { margin: 0; font-family: Georgia, serif; font-style: italic; font-size: 15px; }
.citation-source { font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; }
.moment-card .btn-primary, .moment-card .btn-accent { align-self: stretch; }

/* -- v0.2: holdToCommit (press-and-hold seal) -- */
.hold-card { align-items: center; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);

<script>
(function () {
  "use strict";
  var HANDLER = "weirBridge";
  var ANDROID_IFACE = "WeirAndroid";
  var RESPONSE_GLOBAL = "__weirBridgeResponse";
  var VERSION = "0.2.0";
  var PROTOCOL_VERSION = 1;
  var pending = {};
  var counter = 0;
  var seq = 0;
  var sessionId = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : ("sess-" + Date.now());
  var flowId = (window.__weirManifest && window.__weirManifest.flowId) || "unknown";
  var warnedProducts = false;
  // v1 join-fix rider: optional, only sent when a host actually injects one.
  var userId = window.__weirUserId || undefined;
  // Version negotiation state — starts pessimistic (v0), upgraded once the
  // capabilities probe (kicked off below) resolves.
  var hostCapabilities = { version: 0, methods: [] };

  var TIMEOUT_MS = {
    "permission.request": 30000,
    "purchase.start": 300000,
    "purchase.restore": 60000,
    "haptic": 5000,
    "event": 10000,
    "complete": 10000,
    "dismiss": 10000,
    "capabilities": 5000,
    "products.list": 10000
  };

  function genId() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    counter += 1;
    return "weir-" + Date.now() + "-" + counter;
  }

  var responder = window[RESPONSE_GLOBAL];
  if (!responder || !responder.__weirBridgeRegistered) {
    responder = function (res) {
      var p = pending[res.id];
      if (!p) return;
      delete pending[res.id];
      if (res.ok) p.resolve(res.result);
      else p.reject(new Error(res.error));
    };
    responder.__weirBridgeRegistered = true;
    window[RESPONSE_GLOBAL] = responder;
  }

  function simulate(method) {
    switch (method) {
      case "permission.request":
        return { status: "granted" };
      case "purchase.start":
        return { status: "purchased", transactionId: "sim-" + genId() };
      case "purchase.restore":
        return { status: "restored", productIds: [] };
      // Local/browser preview (no webkit handler) always behaves like a
      // fully-capable current-version host — weir dev's own mocks are what
      // exercise the v0-degradation paths deliberately, via a real
      // "capabilities" rejection it can choose to simulate; this generic
      // no-host fallback isn't the place to fake that.
      case "capabilities":
        return { version: PROTOCOL_VERSION, methods: ["permission.request", "purchase.start", "purchase.restore", "haptic", "event", "complete", "dismiss", "capabilities", "products.list"] };
      case "products.list":
        return { products: window.__weirProducts || [] };
      default:

    }

  // object to window.webkit.messageHandlers[HANDLER]; Android

  // @JavascriptInterface postMessage accepts strings ONLY, so the Android path
  // posts JSON.stringify(req). The receive side (RESPONSE_GLOBAL) is identical
  // on both. Returns null when no native host is present (browser preview /
  // Layer 2 evals) so callBridge falls back to simulate().

      return { post: function (req) { window[ANDROID_IFACE].postMessage(JSON.stringify(req)); } };
    }

  // negotiated version, not a race against the probe.

  }).catch(function () {

    // the pessimistic default set above. Never let this reject ready().

    // renderer's per-screen-type emissions (quiz_answer, input_submitted,
    // branch_decision, loader_completed, commit, permission_prompt_shown,
    // permission_result, paywall_shown, screen_skipped, flow_started) match
    // @x/spec's events.ts FlowEvent shapes field-for-field, so the host's
    // EventSink receives the SAME stream shape the Layer 2 anchors lock
    // (those anchors run the headless engine, not this bridge — matching
    // shapes is what makes the two comparable, not the same code path).
    // screenId is optional and only sets the envelope's own screenId
    // (informational, mirrors screen()'s own second positional arg below);
    // omit it for flow-level events with no single originating screen.

    },

    // branchy flow), mirroring engine.ts's impressionIndex.

      return emit({ type: "screen_impression", screen: screenId, screenType: screenType, index: index }, screenId);
    },
    // reason matches FlowCompleted's enum (events.ts): "reached_end" |
    // "purchased" | "dismissed" — defaults to "reached_end" (the plain

    // value — a latent mismatch against the frozen event vocabulary fixed
    // here, not a deliberate prior design.)
    complete: function (variables, reason) {
      return emit({ type: "flow_completed", flowId: flowId, reason: reason || "reached_end" }).then(function () {
        return callBridge("complete", { variables: variables || [] });
      });
    },
    // Dismissing IS the flow ending (spec_2's paywall dismiss affordance is
    // the only caller today) — auto-emits flow_completed the same way
    // complete() does, so a dismissed flow isn't silently absent from the
    // funnel the way it was before this fix.

      return emit({ type: "flow_completed", flowId: flowId, reason: "dismissed" }).then(function () {
        return callBridge("dismiss", { reason: reason || "user_dismissed" });
      });
    },

    // events.ts's PurchaseIntent/PurchaseResult require — omitted, these
    // degrade to no screen field, which independently fails FlowEvent
    // validation, so pass it.
    purchase: function (productId, offerId, screenId) {

        return callBridge("purchase.start", { productId: productId, offerId: offerId }).then(function (result) {
          return emit({ type: "purchase_result", screen: screenId, product: productId, status: result.status }, screenId).then(function () {
            return result;
          });
        });
      });
    },
    restorePurchases: function () { return callBridge("purchase.restore", {}); },

      // v1: prefer the real RPC when the negotiated host supports it. The
      // product ids come from the manifest (window.__weirManifest.products,
      // the same list weir_embed's build derives from the flow's paywall
      // screens) — StoreKit 2 has no "list everything" API, only fetch-by-id.
      // Falls through to the bootstrap global (v0 behavior, unchanged) on a
      // v0 host, a host missing products.list specifically, no declared
      // product ids to ask for, or if the RPC itself errors (e.g. StoreKit
      // hasn't loaded the catalog yet).
      var manifestProductIds = ((window.__weirManifest && window.__weirManifest.products) || []).map(function (p) { return p.id; });

        return callBridge("products.list", { productIds: manifestProductIds }).then(function (result) {
          return result.products;
        }).catch(function () {

        warnedProducts = true;

    permissionStatus: function (type) {
      var cached = window.__weirPermissionStatus || {};

    },

    // v1: intensity (0-1) and soft/rigid styles are additive on the bridge
    // schema, but a genuinely v0 native host's own Codable enum won't have
    // those style cases at all — sending them to a v0 host still fails at
    // decode time there (not something weir.js can paper over without
    // knowing the host's exact style vocabulary, only its declared bridge
    // version). Template code driving a ramping interaction (hold-to-seal)
    // should check window.Weir.hostVersion before using soft/intensity.
    haptic: function (style, intensity) {
      var params = { style: style };
      if (intensity !== undefined) params.intensity = intensity;
      return callBridge("haptic", params);
    },
    openSettings: function () { return emit({ type: "open_settings" }); },
    openURL: function (url) { return emit({ type: "open_url", url: url }).then(function () {

    get hostVersion() { return hostCapabilities.version; },
    __version: VERSION
  };

  window.Weir = Weir;
  window.__weirCallBridge = callBridge; // legacy internal hook, template internals may still use it
})();

<script>
(function () {
  "use strict";
  var spec = JSON.parse(document.getElementById("flow-spec").textContent);
  var momentAssetsEl = document.getElementById("moment-assets");
  var momentAssets = momentAssetsEl ? JSON.parse(momentAssetsEl.textContent || "{}") : {};
  var screens = spec.screens;
  var byId = {};
  for (var i = 0; i < screens.length; i++) byId[screens[i].id] = screens[i];
  var order = screens.map(function (s) { return s.id; });
  var state = {};
  (spec.variables || []).forEach(function (v) {
    if (v.default !== undefined) state[v.id] = v.default;
  });

  // ---- RFC-004 — inlined bucketer (byte-identical to @x/renderer's
  // experiment.ts assignVariant — pinned by an equivalence test that feeds
  // 10k+ userIds through both). Kept as plain functions on this scope so
  // the equivalence test can exercise the SAME source text this runtime
  // actually ships (see bucketer.ts, which this literal is generated from).
  
  var WEIR_HOLDOUT = "__holdout__";
  function weirHashUnit(key) {
    var h = 0x811c9dc5;
    for (var i = 0; i < key.length; i++) {
      h ^= key.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0) / 0x100000000;
  }
  function weirAssignVariant(exp, userId) {
    var u = weirHashUnit(userId + ":" + exp.id);
    if (exp.holdout > 0 && u < exp.holdout) {
      return { experiment: exp.id, variant: WEIR_HOLDOUT };
    }
    var rescaled = exp.holdout > 0 ? (u - exp.holdout) / (1 - exp.holdout) : u;
    var total = 0;
    for (var i = 0; i < exp.variants.length; i++) total += exp.variants[i].weight;
    var acc = 0;
    for (var j = 0; j < exp.variants.length; j++) {
      acc += exp.variants[j].weight / total;
      if (rescaled < acc) return { experiment: exp.id, variant: exp.variants[j].id };
    }
    return { experiment: exp.id, variant: exp.variants[exp.variants.length - 1].id };
  }


  // Variant assignment resolved once, before the first screen (RFC-004
  // §4.2 step 1). No window.__weirUserId means no stable bucketing key —
  // the flow still renders, it just isn't part of any experiment (every
  // gate is treated as ungated baseline, matching a holdout assignment).
  var weirUserId = window.__weirUserId;
  var assignmentMap = {};
  (spec.experiments || []).forEach(function (exp) {
    assignmentMap[exp.id] = weirUserId ? weirAssignVariant(exp, weirUserId).variant : WEIR_HOLDOUT;
  });

  function isScreenActive(screen) {
    if (!screen.variant) return true;
    var assigned = assignmentMap[screen.variant.experiment];
    if (assigned === undefined || assigned === WEIR_HOLDOUT) return true;
    return screen.variant.showFor.indexOf(assigned) !== -1;
  }

  // Side-effect-free next-resolution, used only to chase through gated-out
  // screens (RFC-004 §4.2 step 3) — never emits branch_decision, since an
  // inactive screen produces NO events, including for its own transitions.
  function resolveNextQuiet(screen) {
    if (screen.next === undefined) {
      var idx = order.indexOf(screen.id);
      return idx >= 0 && idx + 1 < order.length ? order[idx + 1] : null;
    }
    if (typeof screen.next === "string") return screen.next;
    for (var i = 0; i < screen.next.branches.length; i++) {
      if (evalCond(screen.next.branches[i].when)) return screen.next.branches[i].goto;
    }
    return screen.next.default;
  }

  function resolveActiveScreen(startId) {
    var id = startId;
    var hops = 0;
    while (id !== null && id !== undefined) {
      var screen = byId[id];
      if (!screen) return id; // unknown target — let the caller's byId lookup fail visibly
      if (isScreenActive(screen)) return id;
      if (++hops > 500) return null;
      id = resolveNextQuiet(screen);
    }
    return null;
  }

  var current = resolveActiveScreen(spec.entry || order[0]);
  var app = document.getElementById("app");
  var fill = document.getElementById("progress-fill");
  var painted = false;
  // Per-visit screen impression counter, mirroring engine.ts's
  // impressionIndex — increments on every visit, including repeat visits
  // to the same screen id in a branchy flow.
  var impressionIndex = 0;

  // ---- theme.motion (v0.2) ----
  // The Zod schema only defaults the *container* motion object to {} (see
  // resolveTheme's comment at the top of this file for why) — individual
  // headline/ambient/transition/particle fields can still be missing, so we
  // apply the documented defaults here too.
  var motion = (spec.theme && spec.theme.motion) || {};
  var motionHeadline = motion.headline || "none";
  var motionAmbient = motion.ambient || "none";
  var motionTransition = motion.transition || "fade";
  var motionParticle = motion.particle || {};
  var particleSprite = motionParticle.sprite || "leaf";
  var particleDensity = motionParticle.density !== undefined ? motionParticle.density : 0.4;
  var reducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // below); it starts after a fixed delay comfortably past a headless
  // walker's post-flowReady screenshot, so eval screenshots stay
  // byte-identical across repeat renders (Layer 2b's stability check) while
  // real users still see the reveal play out.
  var MOTION_START_DELAY_MS = 700;
  var TYPEWRITER_STEP_MS = 22;
  // Ambient sprites are inline SVG (never emoji), filled in brand gold or a
  // muted olive (a 50/50 mix of accent gold + primary green), alternated
  // deterministically per particle.
  var GOLD_FILL = "#c9a227";
  var OLIVE_FILL = "#748739";
  var SPRITE_PATH = {
    leaf: "M12 2C5 2 3 8 3 13c0 6 4 9 9 9s9-3 9-9c0-5-2-11-9-11z",
    petal: "M12 2c6 4 6 12 0 20-6-8-6-16 0-20z",
    dust: "M12 7a5 5 0 100 10 5 5 0 000-10z",
    star: "M12 2c0 5 3 8 8 8-5 0-8 3-8 8 0-5-3-8-8-8 5 0 8-3 8-8z"
  };
  function spriteSvg(name, fill) {
    var d = SPRITE_PATH[name] || SPRITE_PATH.leaf;
    var vein = name === "leaf" ? '<path d="M12 4L12 21" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>' : "";
    return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="' + d + '" fill="' + fill + '"/>' + vein + "</svg>";
  }

  // Deterministic pseudo-random in [0,1) — NOT Math.random(), so the ambient
  // layer's per-particle offsets are identical on every render (required for
  // Layer 2b's byte-identical screenshot check).
  function seeded(n) {
    var x = Math.sin(n * 999.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // v0.2 — *emphasis* markers in headline text render as a gold-italic-serif
  // span (see .heading-em); everything else stays normal ink.
  var EMPHASIS_RE = /\*([^*]+)\*/g;
  function renderEmphasisInto(node, text) {
    node.textContent = "";

    // markers, e.g. "Alhamdulillah for *{{gratitude}}*, {{name}}." with an
    // empty gratitude renders "... for **, ...". Collapse runs of 2+ adjacent
    // asterisks so they never surface as literal '*'. Real "*word*" emphasis
    // is untouched (a genuine "* *" between two separate runs has a space, so
    // it isn't matched here).
    text = String(text).replace(/\*\*+/g, "");
    var lastIndex = 0;
    var re = new RegExp(EMPHASIS_RE.source, "g");
    var m;
    while ((m = re.exec(text))) {
      if (m.index > lastIndex) node.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      var em = document.createElement("span");
      em.className = "heading-em";
      em.textContent = m[1];
      node.appendChild(em);
      lastIndex = m.index + m[0].length;
    }
    if (lastIndex < text.length) node.appendChild(document.createTextNode(text.slice(lastIndex)));
  }

  function applyHeadlineMotion(node, text) {
    // Plain (marker-stripped) text drives typewriter timing so the caret
    // never types literal asterisks; the styled two-tone render is swapped
    // in once the reveal completes (or immediately for "none"/reduced-motion).
    var plain = text.replace(EMPHASIS_RE, "$1");
    if (reducedMotion || motionHeadline === "none") {
      renderEmphasisInto(node, text);
      return;
    }
    if (motionHeadline === "typewriter") {
      node.textContent = "";
      // "typing" marks the reveal as in-progress — a walker/eval can poll
      // for its absence as a "headline finished revealing" signal instead
      // of guessing a fixed wait.
      node.classList.add("motion-typewriter", "typing");
      var i = 0;
      setTimeout(function step() {
        i++;
        if (i < plain.length) {
          node.textContent = plain.slice(0, i);
          setTimeout(step, TYPEWRITER_STEP_MS);
        } else {
          node.classList.remove("typing");
          renderEmphasisInto(node, text);
        }
      }, MOTION_START_DELAY_MS);
    } else if (motionHeadline === "fade-up") {
      renderEmphasisInto(node, text);
      // Same start delay as typewriter, for the same reason (see
      // MOTION_START_DELAY_MS above) — without it this animation would
      // start on the entry screen too, breaking Layer 2b's byte-identical
      // stability check.
      node.style.animationDelay = MOTION_START_DELAY_MS + "ms";
      node.classList.add("motion-fadeup", "revealing");
      node.addEventListener("animationend", function () { node.classList.remove("revealing"); }, { once: true });
    }
  }

  var ambientLayer = null;
  function ensureAmbient() {
    if (ambientLayer || reducedMotion || motionAmbient !== "particles") return;
    // ~40% of the prior count — calmer, premium density.
    var count = Math.max(1, Math.round((6 + particleDensity * 14) * 0.4));
    var layer = document.createElement("div");
    layer.className = "ambient-layer";
    layer.setAttribute("aria-hidden", "true");
    for (var i = 0; i < count; i++) {
      var p = document.createElement("span");
      p.className = "ambient-particle";
      var fill = seeded(i * 31 + 11) > 0.5 ? GOLD_FILL : OLIVE_FILL;
      p.innerHTML = spriteSvg(particleSprite, fill);
      var size = (10 + seeded(i * 23 + 7) * 10).toFixed(1) + "px";
      p.style.left = (seeded(i * 7 + 1) * 100).toFixed(2) + "%";
      p.style.width = size;
      p.style.height = size;
      p.style.animationDuration = (6 + seeded(i * 17 + 5) * 5).toFixed(2) + "s";
      p.style.animationDelay = (MOTION_START_DELAY_MS / 1000 + seeded(i * 13 + 3) * 4).toFixed(2) + "s";
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    ambientLayer = layer;
  }

  function interpolate(text) {
    if (typeof text !== "string") return text;
    return text.replace(/\{\{(\w+)\}\}/g, function (_, k) {
      var v = state[k];
      return v === undefined ? "" : String(v);
    });
  }

  function coerce(a, b) {
    if (typeof a === "number" && typeof b === "string" && b.trim() !== "" && !isNaN(Number(b))) {
      return { a: a, b: Number(b) };
    }
    if (typeof a === "string" && typeof b === "number") return { a: a, b: String(b) };
    return { a: a, b: b };
  }

  function evalCond(cond) {
    if ("all" in cond) return cond.all.every(evalCond);
    if ("any" in cond) return cond.any.some(evalCond);
    if ("not" in cond) return !evalCond(cond.not);
    var raw = state[cond.var];
    switch (cond.op) {
      case "eq": { var c1 = coerce(raw, cond.value); return c1.a === c1.b; }
      case "neq": { var c2 = coerce(raw, cond.value); return c2.a !== c2.b; }
      case "gt": return typeof raw === "number" && raw > cond.value;

  }

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function renderTextInput(s, root) {

    if (s.benefits) wrap.appendChild(renderBenefitCard(s.benefits));

    // already carries; everything else (name, gratitude, niyah free text)
    // is plain prose, so autocorrect/autocapitalize stay off across the
    // board to match native's OBV5BigField (parity-inventory.md).
    if (!s.multiline) {

    });

    function validate() {

  function renderLoader(s, root) {
    var wrap = el("div", "card loader-card");
    if (s.title) wrap.appendChild(heading(interpolate(s.title)));
    var bar = el("div", "loader-track");
    var fillEl = el("div", "loader-fill");
    bar.appendChild(fillEl);
    wrap.appendChild(bar);
    var msg = el("p", "loader-message", interpolate(s.messages[0]));
    wrap.appendChild(msg);
    root.appendChild(wrap);

    // durationMs is honored for pacing (message rotation cadence) but the
    // actual auto-advance timer is capped so headless/eval runs stay fast.
    var duration = Math.min(s.durationMs || 2500, 400);
    var msgCount = s.messages.length;
    var msgInterval = Math.max(duration / msgCount, 30);
    var idx = 0;
    var msgTimer = setInterval(function () {
      idx = (idx + 1) % msgCount;
      msg.textContent = interpolate(s.messages[idx]);
    }, msgInterval);

    fillEl.style.transitionDuration = duration + "ms";
    requestAnimationFrame(function () { fillEl.style.transform = "scaleX(1)"; });

    setTimeout(function () {
      clearInterval(msgTimer);
      (s.computes || []).forEach(function (c) { if (!(c in state)) state[c] = ""; });
      window.Weir.track("loader_completed", { screen: s.id, computed: s.computes || [] });
      goTo(resolveNext(s));
    }, duration);
  }

  function renderPermissionPrime(s, root) {
    var wrap = el("div", "card");
    wrap.appendChild(heading(interpolate(s.title)));
    if (s.subtitle) wrap.appendChild(el("p", "subtitle", interpolate(s.subtitle)));
    if (s.benefits) wrap.appendChild(renderBenefitCard(s.benefits));
    // permission_prompt_shown fires once, when this priming screen itself
    // renders — matching engine.ts's permissionPrime case, which emits it
    // unconditionally per visit, before the grant/deny outcome is known
    // (the WEIR screen IS the "prompt" in this model, distinct from the
    // native OS dialog window.Weir.requestPermission() may or may not
    // actually summon).
    window.Weir.track("permission_prompt_shown", { screen: s.id, permission: s.permission });
    function emitResult(granted) {
      window.Weir.track("permission_result", { screen: s.id, permission: s.permission, granted: granted });
    }
    var prime = ctaButton(s.primeCta, s.primeCta.label, "cta");
    prime.addEventListener("click", function () {
      prime.disabled = true;
      window.Weir.requestPermission(s.permission, s.id).then(function (result) {
        var granted = result.status === "granted";
        if (s.resultVariable) state[s.resultVariable] = granted;
        emitResult(granted);
        goTo(resolveNext(s));
      }).catch(function () {
        // Native failed to respond — treat as not-granted rather than stranding the user.
        if (s.resultVariable) state[s.resultVariable] = false;
        emitResult(false);
        prime.disabled = false;
        goTo(resolveNext(s));
      });
    });
    wrap.appendChild(prime);
    if (s.skipCta) {
      var skip = el("button", "btn btn-ghost", interpolate(s.skipCta.label));
      skip.addEventListener("click", function () {
        if (s.resultVariable) state[s.resultVariable] = false;
        // Skipping never summons the native OS dialog, but the priming
        // screen itself was still shown-and-declined — matches
        // engine.ts's model, where "skip" also resolves to granted:false.
        emitResult(false);
        goTo(resolveNext(s));
      });
      wrap.appendChild(skip);
    }
    root.appendChild(wrap);
  }

  function renderPaywall(s, root) {
    var wrap = el("div", "card paywall-card" + (s.contentAlign === "center" ? " paywall-centered" : ""));
    // paywall_shown fires once, when this screen renders — matches
    // engine.ts's paywall case, which emits it unconditionally per visit,
    // before any purchase/dismiss outcome is known.
    window.Weir.track("paywall_shown", { screen: s.id, products: s.products.map(function (p) { return p.id; }) });
    // spec_2 — dismiss affordance. Defaults to true (dismissable !== false),
    // so an existing, unedited paywall screen becomes closeable rather than
    // inescapable. Goes through window.Weir.dismiss(), which now also
    // auto-emits flow_completed(reason:"dismissed") — see weirjs/runtime.ts.
    if (s.dismissable !== false) {
      var closeBtn = el("button", "paywall-close", "\u2715");
      closeBtn.setAttribute("aria-label", "Close");
      closeBtn.setAttribute("data-testid", "paywall-close");
      closeBtn.addEventListener("click", function () {
        window.Weir.dismiss("paywall_declined");
      });
      wrap.appendChild(closeBtn);
    }
    if (s.title) wrap.appendChild(el("h2", "eyebrow", interpolate(s.title)));
    wrap.appendChild(heading(interpolate(s.headline)));
    if (s.subtitle) wrap.appendChild(el("p", "subtitle", interpolate(s.subtitle)));
    if (s.features) wrap.appendChild(renderFeatureList(s.features, s.featureStyle));
    var list = el("div", s.productsLayout === "row" ? "products products-row" : "products");
    var selectedProductId = s.products.length ? s.products[0].id : null;
    // spec_2 §4.1/§7: prices come from weir.products() (localized, incl.
    // intro-offer/trial terms), never a literal currency string authored
    // into the spec. PaywallProduct.priceHint still exists in the frozen
    // node schema (kept optional/inert here rather than touching the
    // schema) but is deliberately never read for display anymore.
    var priceEls = {};
    s.products.forEach(function (p, i) {
      var card = el("div", "product" + (p.highlighted ? " highlighted" : "") + (i === 0 ? " selected" : ""));
      card.setAttribute("data-option-id", p.id);
      if (p.badge) card.appendChild(el("span", "product-badge", p.badge));
      card.appendChild(el("span", "product-label", p.label));
      var priceEl = el("span", "product-price", "\u2014"); // em dash — placeholder, never a currency string
      priceEl.setAttribute("data-testid", "product-price");
      card.appendChild(priceEl);
      if (p.caption) card.appendChild(el("span", "product-caption", p.caption));
      priceEls[p.id] = priceEl;
      card.addEventListener("click", function () {
        Array.prototype.forEach.call(list.children, function (c) { c.classList.remove("selected"); });
        card.classList.add("selected");
        selectedProductId = p.id;
      });
      list.appendChild(card);
    });
    wrap.appendChild(list);
    if (window.Weir && window.Weir.products) {
      window.Weir.products().then(function (products) {
        (products || []).forEach(function (product) {
          var priceEl = priceEls[product.id];
          if (!priceEl) return;
          var text = product.priceString || "Price unavailable";
          if (product.introOffer && product.introOffer.priceString) {
            text += " (" + product.introOffer.priceString + " " + product.introOffer.periodDescription + ")";
          }
          priceEl.textContent = text;
        });
      }).catch(function () { /* placeholders already shown; nothing else to do */ });
    }
    var errorMsg = el("p", "paywall-error");
    errorMsg.style.display = "none";
    var cta = ctaButton(s.cta, s.cta.label, "cta");
    var restoreBtn = el("button", "btn btn-link", s.restoreLabel || "Restore");
    function showError(text) {
      errorMsg.textContent = text || "Something went wrong \u2014 try again.";
      errorMsg.style.display = "";
    }
    function setBusy(busy) { cta.disabled = busy; restoreBtn.disabled = busy; }
    cta.addEventListener("click", function () {
      errorMsg.style.display = "none";
      setBusy(true);
      // Weir.purchase() auto-emits purchase_intent/purchase_result around
      // the same bridge call this used to make directly.
      window.Weir.purchase(selectedProductId, undefined, s.id).then(function (result) {
        if (result.status === "purchased") { completeFlow("purchased"); }
        else if (result.status === "failed") { setBusy(false); showError(result.error); }
        else { setBusy(false); } // "cancelled": user backed out, not an error.
      }).catch(function (err) { setBusy(false); showError(err && err.message); });
    });
    wrap.appendChild(cta);
    wrap.appendChild(errorMsg);
    // Small muted microcopy under the CTA (trial note + legal disclosure).
    // {price:productId} tokens resolve from weir.products() at runtime —
    // never a literal price baked into the spec, so real localized pricing
    // stays correct instead of one locale's number getting hardcoded.
    if (s.footnote) {
      var footnoteLines = Array.isArray(s.footnote) ? s.footnote : [s.footnote];
      var priceTokenPattern = /\{price:([a-zA-Z0-9_.-]+)\}/g;
      var footnoteEls = footnoteLines.map(function (line) {
        var placeholder = line.replace(priceTokenPattern, "\u2026");
        var p = el("p", "paywall-footnote", interpolate(placeholder));
        wrap.appendChild(p);
        return { el: p, raw: line };
      });
      if (window.Weir && window.Weir.products) {
        window.Weir.products().then(function (products) {
          footnoteEls.forEach(function (item) {
            var resolved = item.raw.replace(priceTokenPattern, function (_m, id) {
              var match = (products || []).filter(function (pr) { return pr.id === id; })[0];
              return match ? match.priceString : "\u2026";
            });
            item.el.textContent = interpolate(resolved);
          });
        }).catch(function () { /* placeholders already shown; nothing else to do */ });
      }
    }
    restoreBtn.addEventListener("click", function () {
      errorMsg.style.display = "none";
      setBusy(true);
      window.Weir.restorePurchases().then(function (result) {
        if (result.status === "restored") { completeFlow("purchased"); }
        else { setBusy(false); showError(result.error || "Nothing to restore."); }
      }).catch(function (err) { setBusy(false); showError(err && err.message); });
    });
    wrap.appendChild(restoreBtn);
    var links = el("div", "legal-links");
    if (s.termsUrl) {
      var t = el("a", "legal-link", "Terms");
      t.href = s.termsUrl; t.target = "_blank"; t.rel = "noopener";
      links.appendChild(t);
    }
    if (s.privacyUrl) {
      var pr = el("a", "legal-link", "Privacy");
      pr.href = s.privacyUrl; pr.target = "_blank"; pr.rel = "noopener";
      links.appendChild(pr);
    }
    if (links.children.length) wrap.appendChild(links);
    if (s.dismissable !== false && s.dismissLabel) {
      var dismissLink = el("button", "paywall-dismiss-link", interpolate(s.dismissLabel));
      dismissLink.setAttribute("data-testid", "paywall-dismiss-link");
      dismissLink.addEventListener("click", function () {
        window.Weir.dismiss("paywall_declined");
      });
      wrap.appendChild(dismissLink);
    }
    root.appendChild(wrap);
  }

  function renderCustomHtml(s, root) {
    var wrap = el("div", "card custom-html-card");
    if (s.title) wrap.appendChild(heading(interpolate(s.title)));
    var container = el("div", "custom-html");
    // s.html is validated at spec time (no <script>, no on*= handlers).
    container.innerHTML = s.html;
    wrap.appendChild(container);

    // Populated by the bound-input/stepper wiring below; emitted as
    // input_submitted (one event per bound variable) on cta click, matching
    // how slider/numberInput/textInput report on Continue rather than per
    // keystroke.
    var inputBoundVars = [];
    var cta = null;
    if (s.cta) {
      cta = ctaButton(s.cta, s.cta.label, "cta");
      cta.addEventListener("click", function () {
        inputBoundVars.forEach(function (varId) {
          // A plain (non-stepper) bound field the walker/user never actually
          // touched (e.g. an optional "anything else?" note) has no value in
          // state at all — nothing was submitted, so nothing is reported.
          // Stepper-bound vars are always present here (buildStepperControl
          // seeds state via one onChange call at construction).
          if (!(varId in state)) return;
          window.Weir.track("input_submitted", { screen: s.id, variable: varId, value: state[varId] });
        });
        goTo(resolveNext(s));
      });
    }

    // Declarative variable binding, wired by this trusted runtime code
    // against attributes found in the (script-free) author HTML — see
    // CustomHtmlScreen.binds' doc comment in packages/spec/src/schema.ts.
    // A bound element carrying data-weir-optional is still in s.binds (so
    // it's still conform-seeded and coerced/wired the same way) but doesn't
    // gate the CTA — the customHtml equivalent of textInput's optional
    // fields (e.g. an "anything else?" note that shouldn't block Continue).
    var required = (s.binds || []).filter(function (id) {
      var boundNode = container.querySelector('[data-weir-bind="' + id + '"], [data-weir-option^="' + id + ':"]');
      return !(boundNode && boundNode.hasAttribute("data-weir-optional"));
    });
    function refreshGate() {
      if (!cta) return;
      var allSet = required.every(function (id) {
        var v = state[id];
        return v !== undefined && v !== null && v !== "";
      });
      cta.disabled = required.length > 0 && !allSet;
    }

    // [data-weir-bind="variableId"] on a plain <input>/<select> — coerced
    // per the variable's declared type on every input/change.
    var boundEls = container.querySelectorAll("[data-weir-bind]:not([data-weir-stepper])");
    Array.prototype.forEach.call(boundEls, function (node) {
      var varId = node.getAttribute("data-weir-bind");
      inputBoundVars.push(varId);
      var eventName = node.tagName === "SELECT" || node.type === "checkbox" ? "change" : "input";
      node.addEventListener(eventName, function () {
        var raw = node.type === "checkbox" ? node.checked : node.value;
        state[varId] = coerceVarValue(varId, raw);
        refreshGate();
      });
    });

    // [data-weir-bind="variableId"][data-weir-stepper] on an EMPTY
    // container — the runtime builds the full −/value/+ control into it
    // (buildStepperControl), reading data-weir-min/-max/-step/-value/-unit
    // for config. Never author-supplied stepper markup/script. Two opt-in
    // variants, same attribute contract numberInput's display/unitToggle
    // fields use:
    //  - data-weir-display="feetInches" — two side-by-side ft/in steppers
    //    combining into one canonical centimeter value.
    //  - data-weir-unit-options='[{"label":"LB","unit":"lb","factor":0.453592}]'
    //    (+ optional data-weir-unit-default index) — a unit-toggle pill
    //    above a single stepper, same as numberInput.unitToggle.
    var stepperEls = container.querySelectorAll("[data-weir-bind][data-weir-stepper]");
    Array.prototype.forEach.call(stepperEls, function (node) {
      var varId = node.getAttribute("data-weir-bind");
      inputBoundVars.push(varId);
      var min = node.hasAttribute("data-weir-min") ? Number(node.getAttribute("data-weir-min")) : undefined;
      var max = node.hasAttribute("data-weir-max") ? Number(node.getAttribute("data-weir-max")) : undefined;
      var step = node.hasAttribute("data-weir-step") ? Number(node.getAttribute("data-weir-step")) : 1;
      var initial = node.hasAttribute("data-weir-value") ? Number(node.getAttribute("data-weir-value")) : (min !== undefined ? min : 0);
      var unit = node.getAttribute("data-weir-unit") || undefined;
      if (node.getAttribute("data-weir-display") === "feetInches") {
        node.appendChild(buildFeetInchesStepper({
          initialCanonical: initial,
          canonicalMin: min,
          canonicalMax: max,
          onChange: function (v) { state[varId] = v; refreshGate(); },
        }));
        return;
      }
      var unitOptionsRaw = node.getAttribute("data-weir-unit-options");
      if (unitOptionsRaw) {
        var unitOptions;
        try { unitOptions = JSON.parse(unitOptionsRaw); } catch (e) { unitOptions = null; }
        if (unitOptions && unitOptions.length >= 2) {
          node.appendChild(buildUnitToggleStepper({
            options: unitOptions,
            defaultIndex: node.hasAttribute("data-weir-unit-default") ? Number(node.getAttribute("data-weir-unit-default")) : 0,
            initialCanonical: initial,
            canonicalMin: min,
            canonicalMax: max,
            canonicalStep: step,
            onChange: function (v) { state[varId] = v; refreshGate(); },
          }));
          return;
        }
      }
      node.appendChild(buildStepperControl({
        value: initial,
        min: min,
        max: max,
        step: step,
        unit: unit,
        onChange: function (v) { state[varId] = v; refreshGate(); },
      }));
    });

    // [data-weir-option="variableId:value"] on any tappable element — a
    // discrete tap-to-set target (e.g. a gender/choice card). Clicking sets
    // the variable and toggles a "weir-active" class among every element
    // sharing the same variableId, so the author's own CSS can style the
    // selected state however matches the reference design.
    var optionEls = container.querySelectorAll("[data-weir-option]");
    Array.prototype.forEach.call(optionEls, function (node) {
      var raw = node.getAttribute("data-weir-option") || "";
      var sep = raw.indexOf(":");
      var varId = sep >= 0 ? raw.slice(0, sep) : raw;
      var value = sep >= 0 ? raw.slice(sep + 1) : "";
      node.addEventListener("click", function () {
        state[varId] = coerceVarValue(varId, value);
        var group = container.querySelectorAll("[data-weir-option^=\"" + varId + ":\"]");
        Array.prototype.forEach.call(group, function (g) { g.classList.remove("weir-active"); });
        node.classList.add("weir-active");
        window.Weir.track("quiz_answer", { screen: s.id, variable: varId, value: state[varId], optionIds: [value] });
        refreshGate();
      });
    });

    refreshGate();
    if (cta) wrap.appendChild(cta);
    root.appendChild(wrap);
  }

  // v3 — canned, non-interactive sourced-answer chat (see renderChatTranscript
  // above for the shared bubble/citation-chip rendering also used by
  // welcome.demo).
  function renderDemo(s, root) {
    var wrap = el("div", "card demo-card");
    if (s.title) wrap.appendChild(heading(interpolate(s.title)));
    if (s.subtitle) wrap.appendChild(el("p", "subtitle", interpolate(s.subtitle)));
    wrap.appendChild(renderChatTranscript(s.messages));
    var cta = ctaButton(s.cta, s.cta.label, "cta");
    cta.addEventListener("click", function () { goTo(resolveNext(s)); });
    wrap.appendChild(cta);
    root.appendChild(wrap);
  }

  // v0.2 — deterministic CSS-gradient placeholder keyed off the image string
  // (no network fetches, no assets; same seed always yields the same hues so
  // Layer 2b's byte-identical stability check still passes). Constrained to
  // the brand-warm family only — deep green through gold — never blue/purple.
  function gradientFor(seed) {
    var str = String(seed || "moment");
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    h = Math.abs(h);

    var deepGreen = "hsl(" + (152 + (h % 10)) + ", 45%, " + (14 + (h % 6)) + "%)";
    var midGreen = "hsl(" + (150 - (h % 8)) + ", 40%, " + (24 + (h % 8)) + "%)";
    var goldEdge = "hsl(" + (40 + (h % 12)) + ", 55%, " + (26 + (h % 10)) + "%)";
    var angle = 150 + (h % 40);
    var order = h % 3;
    var base = order === 0
      ? "linear-gradient(" + angle + "deg, " + deepGreen + " 0%, " + midGreen + " 55%, " + goldEdge + " 100%)"
      : order === 1
      ? "linear-gradient(" + angle + "deg, " + goldEdge + " 0%, " + midGreen + " 50%, " + deepGreen + " 100%)"
      : "linear-gradient(" + angle + "deg, " + midGreen + " 0%, " + deepGreen + " 60%, " + goldEdge + " 100%)";

    // Stronger, closer-in vignette so the bottom edge (where headline/
    // citation/CTA sit, in cream text) reads with more contrast.
    var vignette = "radial-gradient(120% 90% at 50% 20%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.42) 100%)";

    // Soft light source near the top — as if daylight is falling through an
    // archway — offset left/right deterministically by the seed.
    var lightX = 38 + (h % 24); // 38%-62%
    var light = "radial-gradient(55% 36% at " + lightX + "% 6%, rgba(250,238,205,0.24) 0%, rgba(250,238,205,0) 70%)";

    // Arch-silhouette: a dark dome shadow arcing down from just above the
    // card, reading as the underside of an archway — mirrored off the light
    // source so the two read as one lit opening rather than two unrelated
    // shapes.
    var archX = 100 - lightX;
    var arch = "radial-gradient(48% 32% at " + archX + "% -8%, rgba(10,16,10,0.30) 0%, rgba(10,16,10,0) 72%)";

    // Faint deterministic geometric lattice for depth (arabesque-adjacent),
    // offset by the seed so it stays stable per-moment across renders.
    var texAngle = 45 + (h % 90);
    var texGap1 = 18 + (h % 10);
    var texGap2 = 18 + ((h + 7) % 10);
    var texture =
      "repeating-linear-gradient(" + texAngle + "deg, rgba(243,239,230,0.05) 0px, rgba(243,239,230,0.05) 1px, transparent 1px, transparent " + texGap1 + "px), " +
      "repeating-linear-gradient(" + (texAngle + 90) + "deg, rgba(243,239,230,0.04) 0px, rgba(243,239,230,0.04) 1px, transparent 1px, transparent " + texGap2 + "px)";

    // Layer order (front to back): vignette frames the whole composition,
    // then the light/arch pair reads as an architectural opening, then the
    // grain texture, then the base brand-warm gradient underneath it all.
    return vignette + ", " + light + ", " + arch + ", " + texture + ", " + base;
  }

  function renderMoment(s, root) {
    var wrap = el("div", "card moment-card");
    var photo = s.image && momentAssets[s.image];
    if (photo) {
      // Real photography + a dark scrim (heavier at the bottom, where the
      // cream headline/citation/CTA sit) so text stays legible over the image.
      wrap.style.backgroundImage =
        "linear-gradient(to top, rgba(14,22,16,0.94) 0%, rgba(14,22,16,0.70) 32%, rgba(14,22,16,0.22) 62%, rgba(14,22,16,0.10) 100%), url(" + photo + ")";
      wrap.style.backgroundSize = "cover";
      wrap.style.backgroundPosition = "center";
      wrap.classList.add("moment-photo");
    } else {
      wrap.style.backgroundImage = gradientFor(s.image || s.id);
    }
    // Content lives in an inner column so its text stays a readable width,
    // bottom-left over the (possibly full-bleed) photo, rather than stretching.
    var content = el("div", "moment-content");
    if (s.kicker) content.appendChild(el("p", "kicker moment-kicker", interpolate(s.kicker)));
    content.appendChild(heading(interpolate(s.headline), "moment-headline"));
    if (s.body) content.appendChild(el("p", "moment-body", interpolate(s.body)));
    if (s.citation) {
      var cite = el("div", "moment-citation");
      cite.appendChild(el("p", "citation-text", "\u201c" + interpolate(s.citation.text) + "\u201d"));
      cite.appendChild(el("span", "citation-source", interpolate(s.citation.source)));
      content.appendChild(cite);
    }
    var cta = ctaButton(s.cta, s.cta.label, "cta");
    cta.addEventListener("click", function () { goTo(resolveNext(s)); });
    content.appendChild(cta);
    wrap.appendChild(content);
    root.appendChild(wrap);
  }

  function renderHoldToCommit(s, root) {
    var wrap = el("div", "card hold-card");
    var titleEl = heading(interpolate(s.title));
    wrap.appendChild(titleEl);
    var sealedTitleEl = el("h1", "sealed-title");
    sealedTitleEl.style.display = "none";
    wrap.appendChild(sealedTitleEl);
    if (s.subtitle) wrap.appendChild(el("p", "subtitle", interpolate(s.subtitle)));

    var sealed = false;
    var pending = (s.suggestions && s.suggestions[0]) || "";
    var chipsWrap = null;
    var customInput = null;

    if (s.suggestions && s.suggestions.length) {
      chipsWrap = el("div", "chips");
      s.suggestions.forEach(function (sug) {
        var chip = el("button", "chip", sug);
        chip.setAttribute("data-option-id", sug);
        chip.addEventListener("click", function () {
          if (sealed) return;
          pending = sug;
          Array.prototype.forEach.call(chipsWrap.children, function (c) { c.classList.remove("selected"); });
          chip.classList.add("selected");
          if (customInput) customInput.value = "";
        });
        chipsWrap.appendChild(chip);
      });
      wrap.appendChild(chipsWrap);
    }

    if (s.allowCustom) {
      customInput = document.createElement("input");
      customInput.type = "text";
      customInput.className = "text-input";
      customInput.placeholder = "Or make it your own";
      customInput.addEventListener("input", function () {
        if (sealed) return;
        pending = customInput.value;
        if (chipsWrap) Array.prototype.forEach.call(chipsWrap.children, function (c) { c.classList.remove("selected"); });
      });
      wrap.appendChild(customInput);
    }

    var cta = ctaButton(s.cta, s.cta.label, "cta");
    cta.disabled = true;
    cta.addEventListener("click", function () { goTo(resolveNext(s)); });

    var holdWrap = el("div", "hold-wrap");
    var holdBtn = el("button", "hold-seal");
    holdBtn.type = "button";
    holdBtn.setAttribute("data-testid", "hold-seal");

    // Ceremonial medallion: an SVG progress ring (stroke-dasharray/offset)
    // fills as the user presses, plus a serif ن mark that swaps to a gold
    // check on seal.
    var svgNS = "http://www.w3.org/2000/svg";
    var ringR = 62;
    var ringC = 2 * Math.PI * ringR;
    var ringSvg = document.createElementNS(svgNS, "svg");
    ringSvg.setAttribute("class", "hold-seal-svg");
    ringSvg.setAttribute("viewBox", "0 0 132 132");
    var ringTrack = document.createElementNS(svgNS, "circle");
    ringTrack.setAttribute("class", "hold-seal-track");
    ringTrack.setAttribute("cx", "66");
    ringTrack.setAttribute("cy", "66");
    ringTrack.setAttribute("r", String(ringR));
    var ringProgress = document.createElementNS(svgNS, "circle");
    ringProgress.setAttribute("class", "hold-seal-progress");
    ringProgress.setAttribute("cx", "66");
    ringProgress.setAttribute("cy", "66");
    ringProgress.setAttribute("r", String(ringR));
    ringProgress.setAttribute("stroke-dasharray", String(ringC));
    ringProgress.setAttribute("stroke-dashoffset", String(ringC));
    ringSvg.appendChild(ringTrack);
    ringSvg.appendChild(ringProgress);
    holdBtn.appendChild(ringSvg);
    holdBtn.appendChild(el("span", "hold-mark", "\u0646"));
    var holdCheck = el("span", "hold-check", "\u2713");
    holdBtn.appendChild(holdCheck);
    holdWrap.appendChild(holdBtn);
    var holdHint = el("p", "hold-hint", "Press and hold to seal");
    holdWrap.appendChild(holdHint);
    wrap.appendChild(holdWrap);
    wrap.appendChild(cta);

    var pressTimer = null;

    function completeSeal() {
      if (sealed) return;
      sealed = true;
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      var value = (customInput && customInput.value) || pending || "";
      state[s.variable] = value;
      window.Weir.track("commit", { screen: s.id, variable: s.variable, value: value });
      holdBtn.classList.remove("pressing");
      holdBtn.classList.add("sealed");
      // spec_2 §7 Motion: spring-pop on the seal-success checkmark
      // (docs/motion-tokens.md's --motion-spring-pop), not a plain cut.
      holdCheck.classList.add("motion-spring-pop");
      // Snap the ring fully closed regardless of how it was completed (a
      // real press vs. the window.__seal() test hook below), so the sealed
      // state is always visually consistent and deterministic.
      ringProgress.style.transitionDuration = "0ms";
      ringProgress.style.strokeDashoffset = "0";
      holdHint.textContent = "Sealed";
      titleEl.style.display = "none";
      sealedTitleEl.textContent = interpolate(s.sealedTitle || s.title);
      sealedTitleEl.style.display = "";
      cta.disabled = false;
    }

    function startPress() {
      if (sealed) return;
      holdBtn.classList.add("pressing");
      ringProgress.style.transitionDuration = s.holdMs + "ms";
      requestAnimationFrame(function () { ringProgress.style.strokeDashoffset = "0"; });
      pressTimer = setTimeout(completeSeal, s.holdMs);
    }
    function cancelPress() {
      if (sealed) return;
      holdBtn.classList.remove("pressing");
      ringProgress.style.transitionDuration = "150ms";
      ringProgress.style.strokeDashoffset = String(ringC);
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }
    holdBtn.addEventListener("pointerdown", startPress);
    holdBtn.addEventListener("pointerup", cancelPress);
    holdBtn.addEventListener("pointerleave", cancelPress);
    holdBtn.addEventListener("pointercancel", cancelPress);

    // Test hook — headless walkers can't do real long-press timing, so they
    // can complete the seal programmatically instead.
    window.__seal = completeSeal;

    root.appendChild(wrap);
  }

  var renderers = {
    welcome: renderWelcome,
    singleSelect: renderSingleSelect,
    multiSelect: renderMultiSelect,
    slider: renderSlider,
    numberInput: renderNumberInput,
    textInput: renderTextInput,
    loader: renderLoader,
    socialProof: renderSocialProof,
    permissionPrime: renderPermissionPrime,
    paywall: renderPaywall,
    moment: renderMoment,
    holdToCommit: renderHoldToCommit,
    demo: renderDemo,
    customHtml: renderCustomHtml
  };

  function updateProgress() {
    if (!fill) return;
    var idx = order.indexOf(current);
    var pct = order.length > 1 ? (Math.max(0, idx) / (order.length - 1)) * 100 : 100;
    fill.style.transform = "scaleX(" + (pct / 100) + ")";
  }

  function render() {
    var screen = byId[current];
    if (!screen) return;
    app.innerHTML = "";
    window.__seal = undefined; // only holdToCommit screens define this hook
    // A photo-backed moment goes full-bleed: drop #app's padding so the image
    // reaches the screen edges (no card floating on cream). Done via a class on
    // #app rather than position:fixed, which breaks under the transition's
    // persisted transform (animation-fill-mode:both).
    var isPhotoMoment = screen.type === "moment" && screen.image && momentAssets[screen.image];
    app.classList.toggle("bleed", !!isPhotoMoment);
    // Only animate screen-to-screen navigation, never the initial paint —
    // the entry screen must be pixel-identical across renders regardless of
    // capture timing (Layer 2b's stability check), and painted is still
    // false here on the very first call.
    var transitionClass = !painted || reducedMotion || motionTransition === "none"
      ? ""
      : motionTransition === "slide" ? "screen-enter-slide" : "screen-enter-fade";
    var root = el("div", "screen screen-" + screen.type + (transitionClass ? " " + transitionClass : ""));
    root.setAttribute("data-screen", screen.id);
    root.setAttribute("data-screen-type", screen.type);
    // Auto-emitted for every screen type, on every visit including repeats
    // (matches engine.ts's per-visit screen_impression) — never left to a
    // per-screen-type renderer to remember.
    window.Weir.screen(screen.id, screen.type, impressionIndex++);
    var fn = renderers[screen.type];
    if (fn) fn(screen, root);
    app.appendChild(root);
    updateProgress();
    if (!painted) {
      painted = true;
      window.__flowReady = true;
      window.__flowReadyAt = performance.now();
      window.dispatchEvent(new Event("flow-ready"));
    }
  }

  ensureAmbient();
  window.Weir.track("flow_started", { flowId: spec.id, entry: current || (spec.entry || order[0]) });
  // Emitted after flow_started, before any screen_impression — RFC-004 §4.2
  // step 2. Holdout (no userId, or a real holdout bucket) emits nothing.
  (spec.experiments || []).forEach(function (exp) {
    var variant = assignmentMap[exp.id];
    if (variant !== WEIR_HOLDOUT) {
      window.Weir.track("variant_assigned", { experiment: exp.id, variant: variant });
    }
  });
  if (current === null || current === undefined) {
    completeFlow();
  } else {
    render();
  }
})();
</script>
</body>
</html>
