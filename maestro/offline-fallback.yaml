# Layer 3 (Android, Compose) — network-independent render.
#
# Retargeted 2026-07-31 for the Compose `:demo` gallery (see
# permission-prime-grant.yaml's header for what changed). Reframed, not just
# reworded: the pre-Compose demo drew a real distinction between "embedded
# fallback bundle" and "promoted remote bundle" (BundleManager's resolve
# order). This gallery has no remote-config wiring at all in its default
# launch path — `MainActivity.installGallery()` copies every fixture straight
# out of the APK's own assets, and `Weir.present(configRoot = galleryRoot,
# ...)` always renders from that local copy. There is no "fallback FROM a
# remote bundle" scenario to exercise here (same narrowing the pre-Compose
# version already documented for `Weir.presentActivity`).
#
# What this proves instead, honestly: a real specimen renders and completes
# with airplane mode on — every fixture in this gallery is genuinely
# network-independent by construction, not just by omission of a network
# call somewhere unexercised.
appId: studio.aldric.weir.demo
---
- launchApp:
    clearState: true
- setAirplaneMode: enabled
- scrollUntilVisible:
    element:
      text: "Welcome"
    direction: DOWN
- tapOn: "Welcome"
- extendedWaitUntil:
    visible: "Build the path as you walk it"
    timeout: 8000
- tapOn: "Finish specimen"
- extendedWaitUntil:
    visible: ".*Completed welcome.*"
    timeout: 5000
- assertNotVisible: ".*Failed.*"
- takeScreenshot: offline-fallback-complete
- setAirplaneMode: disabled
