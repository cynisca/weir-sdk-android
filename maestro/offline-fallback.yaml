# Layer 3 (Android) — offline / bundled-fallback render.
#
# What this proves: the embedded flow bundle (copied out of assets/ to internal
# storage by MainActivity) renders and the flow completes end-to-end using only
# local content served over the WebViewAssetLoader secure origin — no network
# dependency in the render/bridge path.
#
# What it does NOT prove (documented, not papered over):
# - BundleManager's promoted-remote-vs-embedded fallback: the demo points
#   Weir.presentActivity straight at the materialized embedded bundle, there is
#   no remote bundle to fall back FROM here (same narrowing as sdk-ios).
# - A true airplane-mode toggle. On an emulator this can be added with
#   `- setAirplaneMode: enabled` before launch (Maestro 1.39+); the flow below
#   is network-agnostic because the bundle references no fetch/XHR/WS.
appId: studio.aldric.weir.demo
---
- launchApp:
    clearState: true
- tapOn: "Start onboarding"
- extendedWaitUntil:
    visible: "Begin"
    timeout: 8000
- tapOn: "Begin"
- extendedWaitUntil:
    visible: "Not now"
    timeout: 5000
# Skip the permission prime (the in-app skip does NOT call the bridge) so this
# flow stays purely about local render + completion.
- tapOn: "Not now"
- extendedWaitUntil:
    visible: "Finish"
    timeout: 5000
- tapOn: "Finish"
- extendedWaitUntil:
    visible: ".*onComplete.*"
    timeout: 5000
- assertVisible: ".*notifyOptIn=false.*"
- assertNotVisible: ".*onFailure.*"
- takeScreenshot: offline-fallback-complete
