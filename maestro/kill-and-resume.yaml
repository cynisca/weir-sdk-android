# Layer 3 (Android, Compose) — kill-and-resume mid-flow.
#
# Retargeted 2026-07-31 for the Compose `:demo` gallery (see
# permission-prime-grant.yaml's header for what changed and why).
#
# What this proves: force-stopping the app while a specimen is presented, then
# relaunching, doesn't crash it or leave it wedged — it restarts cleanly at
# the gallery list, ready to present again.
#
# What it does NOT prove: restoration to the same screen or mid-flow state.
# `Weir.present` holds render/variable state in memory for the lifetime of
# that presentation; a process kill discards it, matching the sdk-ios
# baseline. Relaunch lands back on the gallery list, not mid-specimen. That's
# the documented current baseline, not a bug.
appId: studio.aldric.weir.demo
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      text: "Welcome"
    direction: DOWN
- tapOn: "Welcome"
- extendedWaitUntil:
    visible: "Build the path as you walk it"
    timeout: 8000
- takeScreenshot: kill-resume-mid-flow-before-kill
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Flow specimen cabinet"
    timeout: 8000
- assertNotVisible: ".*Failed.*"
- takeScreenshot: kill-resume-after-relaunch
