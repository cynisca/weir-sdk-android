# Layer 3 (Android, Compose) — permission prime, grant path.
#
# Retargeted 2026-07-31 for the Compose `:demo` gallery (M5 P6 deleted the
# WebView/WeirAssetLoader/WeirFlowActivity path this suite used to drive —
# see this file's git history for the pre-Compose version). MainActivity is
# now a single flat specimen list (`Gallery()`); tapping a row's title calls
# `Weir.present(flowId, ...)` directly, no intermediate "Start onboarding" /
# "Begin" screens exist anymore.
#
# Walks to the "Permission prime" specimen (fixtures/flows/permission-prime.json),
# taps its real primeCta ("Allow notifications") to fire the real
# POST_NOTIFICATIONS runtime dialog (API 33+), taps the system "Allow", and
# asserts the status pill reads "Completed permission-prime" — the flow
# actually completed past the permission screen, not just that a dialog
# appeared.
#
# Known narrowing vs. the pre-Compose version (documented, not papered over):
# the old suite asserted a banner showing the LITERAL granted/denied outcome
# (`notifications=granted`). This gallery's status pill only shows
# Ready/Presenting/Completed/Dismissed/Failed — it does not surface the
# flow's captured `resultVariable` value anywhere on screen. This flow can
# prove the real system dialog appeared and the flow completed afterward; it
# cannot independently verify grant vs. deny from the UI alone (see
# permission-prime-deny.yaml, which is the only thing distinguishing the two
# outcomes here — both currently assert "Completed").
#
# `permissions: notifications: unset` matters for the same reason as iOS:
# Maestro auto-grants by default, which would skip the real system dialog.
#
# Note: the POST_NOTIFICATIONS dialog only exists on API 33+. On an API <=32
# emulator the SDK auto-grants (channel path) and there is no dialog to tap —
# drop the "Allow" step on such a device.
appId: studio.aldric.weir.demo
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- scrollUntilVisible:
    element:
      text: "Permission prime"
    direction: DOWN
- tapOn: "Permission prime"
- extendedWaitUntil:
    visible: "Allow notifications"
    timeout: 8000
- tapOn: "Allow notifications"
- extendedWaitUntil:
    visible: "Allow"
    timeout: 5000
- takeScreenshot: permission-grant-system-dialog
- tapOn: "Allow"
- scrollUntilVisible:
    element:
      text: "Flow specimen cabinet"
    direction: UP
- extendedWaitUntil:
    visible: ".*Completed permission-prime.*"
    timeout: 5000
- takeScreenshot: permission-grant-result
