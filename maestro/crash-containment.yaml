# Layer 3 (Android, Compose) — crash containment.
#
# The debug gallery exposes one deliberately missing flow ID. It invokes the
# same public `Weir.present` entry point as every real specimen, so this proves
# a config-resolution failure returns to the host callback rather than
# crashing or stranding the app. The probe is absent from release builds.
appId: studio.aldric.weir.demo
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      text: "Debug failure probe"
    direction: DOWN
- tapOn: "Debug failure probe"
- scrollUntilVisible:
    element:
      text: "Flow specimen cabinet"
    direction: UP
- extendedWaitUntil:
    visible: ".*Failed.*"
    timeout: 8000
- assertNotVisible: ".*Presenting debug-missing-flow.*"
- takeScreenshot: crash-containment-host-failure
