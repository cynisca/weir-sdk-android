# JitPack build configuration for the Weir Android SDK.
# Generated by scripts/sync-sdk-android-mirror.sh in the Weir monorepo —
# edit it there, not here.
jdk:
  - openjdk17

before_install:
  # The AGP 8.7.3 / compileSdk 35 toolchain needs platform 35 present. JitPack's
  # image usually has it; installing is a no-op when it does, and non-fatal when
  # sdkmanager is somewhere unexpected (Gradle's own SDK auto-download is the
  # fallback).
  - |
    SDKMANAGER="$(command -v sdkmanager \
      || ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
            "$ANDROID_HOME"/tools/bin/sdkmanager 2>/dev/null | head -1)"
    if [ -n "$SDKMANAGER" ]; then
      yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
      "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
    fi

install:
  - >-
    ./gradlew --no-daemon --stacktrace
    -PweirGroup=$GROUP.$ARTIFACT
    -PweirVersion=$VERSION
    :weir-core:publishReleasePublicationToMavenLocal
    :weir-observe:publishReleasePublicationToMavenLocal
    :weir:publishReleasePublicationToMavenLocal
